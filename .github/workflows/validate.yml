name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build dense curriculum datasets
        run: |
          node scripts/enrich-computing-datasets.mjs
          node scripts/enrich-esports-datasets.mjs
      - run: node scripts/validate-data.mjs
